<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Demo: /internal (GET • POST • DELETE)</title>
		<style>
			body { font-family: sans-serif; margin: 16px; }
			header { margin-bottom: 12px; }
			.card { border: 1px solid #ddd; padding: 12px; margin: 12px 0; }
			.row { display: flex; gap: 8px; flex-wrap: wrap; }
			input[type="text"], input[type="file"] { flex: 1; padding: 6px; }
			.btn { padding: 6px 10px; }
			.btn.danger { background: #fdd; border: 1px solid #f88; }
			.response { margin-top: 8px; padding: 8px; background: #f7f7f7; white-space: pre-wrap; }
			.response.ok { background: #eaffea; }
			.response.err { background: #ffecec; }
		</style>
</head>
<body>
			<header>
				<h1>/internal — minimal demo</h1>
				<div class="muted">GET • POST (upload) • DELETE</div>
			</header>
	<main>

		<!-- GET -->
		<section class="card" id="get-card">
			<h2>GET</h2>
			<div class="row">
				<input id="get-url" type="text" value="" placeholder="/index.html" />
				<button class="btn" id="btn-get">GET</button>
			</div>
			<div id="get-resp" class="response" hidden></div>
		</section>

		
		<!-- POST (upload) -->
		<section class="card" id="post-card">
			<h2>POST</h2>
			<input id="file-post" type="file" />
			<div class="row" style="margin-top:8px">
				<input id="post-url" type="text" value="" placeholder="Location (optional)"/>
			</div>
			<div class="row" style="margin-top:8px">
				<button class="btn" id="btn-post">Upload</button>
				<button class="btn secondary" id="btn-post-text">Send text</button>
			</div>
			<div id="post-resp" class="response" hidden></div>
		</section>
		
		<!-- PUT -->
		<section class="card" id="put-card">
			<h2>PUT</h2>
			<input id="file-put" type="file" />
			<div class="row" style="margin-top:8px">
				<input id="put-url" type="text" value="" placeholder="Location (optional)"/>
			</div>
			<div class="row" style="margin-top:8px">
				<button class="btn" id="btn-put">Upload</button>
				<button class="btn secondary" id="btn-put-text">Send text</button>
			</div>
			<div id="put-resp" class="response" hidden></div>
		</section>

		<!-- DELETE -->
		<section class="card" id="delete-card">
			<h2>DELETE</h2>
			<div class="row" style="margin-top:8px">
			<input id="del-url" type="text" value="" placeholder="Location (optional)"/>
			</div>
			<div class="row">
				<input id="del-file" type="text" value="" placeholder="File name to delete" />
				<button class="btn danger" id="btn-del">DELETE</button>
			</div>
			<div id="del-listing" class="response" hidden></div>
			<div id="del-resp" class="response" hidden></div>
		</section>

	</main>

	<script>
			function showResp(el, ok, text) {
			el.hidden = false;
			el.className = 'response ' + (ok ? 'ok' : 'err');
			el.innerHTML = '';
			
			const br = document.createElement('br');
			const btn = document.createElement('button');
			btn.type = 'button';
			btn.textContent = 'Hide';
			btn.className = 'btn secondary';
			btn.addEventListener('click', () => {
				el.hidden = true; 
			});
			el.appendChild(btn);
			el.appendChild(br);

			el.appendChild(document.createTextNode(text));
}

		async function loadDeleteListing() {
			const listBox = document.getElementById('del-listing');
			const delFileInput = document.getElementById('del-file');
			listBox.hidden = false;
			listBox.className = 'response';
			listBox.textContent = 'Loading /internal ...';
			try {
				const res = await fetch('/uploads', { method: 'GET' });
				if (res.status === 403 || res.status === 401 || res.status === 405) {
					listBox.textContent = 'listing not allowed';
					return;
				}
				if (!res.ok) {
					listBox.textContent = `Failed to list: ${res.status} ${res.statusText}`;
					return;
				}
				const body = await res.text();
				
			// Parse HTML listing to extract filenames from <a> tags
			const parser = new DOMParser();
			const doc = parser.parseFromString(body, 'text/html');
			const links = doc.querySelectorAll('a');
			const entries = [];
			
			links.forEach((link) => {
				const href = link.getAttribute('href');
				if (href && href !== '..' && href !== '../') {
					entries.push(href);
				}
			});				if (!entries.length) {
					listBox.textContent = 'No entries in /uploads';
					return;
				}
				listBox.innerHTML = '';
				entries.forEach((item) => {
					const row = document.createElement('div');
					row.className = 'row';
					const label = document.createElement('code');
					label.textContent = item;
					const btn = document.createElement('button');
					btn.type = 'button';
					btn.className = 'btn secondary';
					btn.textContent = 'Use';
					btn.addEventListener('click', () => {
						delFileInput.value = item;
					});
					row.appendChild(label);
					row.appendChild(btn);
					listBox.appendChild(row);
				});
			} catch (e) {
				listBox.textContent = `Error: ${e.message}`;
			}
		}

		// GET
		document.getElementById('btn-get').addEventListener('click', async () => {
			const url = (document.getElementById('get-url').value || '').trim();
			const respBox = document.getElementById('get-resp');

			try {
				const res = await fetch(url, { method: 'GET' });
				const body = await res.text();
				showResp(respBox, res.ok, `Status: ${res.status} ${res.statusText}\n\n${body}`);
			} catch (e) {
						showResp(respBox, false, `Error: ${e.message}`);
			}
		});

		// POST (upload file)
		document.getElementById('btn-post').addEventListener('click', async () => {
			const fileInput = document.getElementById('file-post');
			const respBox = document.getElementById('post-resp');
					if (!fileInput.files || !fileInput.files.length) {
						return showResp(respBox, false, 'Pick a file to upload.');
			}
			const form = new FormData();
			form.append('file', fileInput.files[0]);
			try {
				const res = await fetch('/', { method: 'POST', body: form });
				const body = await res.text();
				showResp(respBox, res.ok, `Status: ${res.status} ${res.statusText}\n\n${body}`);
			} catch (e) {
						showResp(respBox, false, `Error: ${e.message}`);
			}
		});

		// POST (simple text as multipart)
		document.getElementById('btn-post-text').addEventListener('click', async () => {
			const respBox = document.getElementById('post-resp');
			const location  = document.getElementById('post-url').value.trim();
			const form = new FormData();
			form.append('note', new Blob([`Demo upload ${new Date().toISOString()}`], { type: 'text/plain' }), 'note.txt');
			try {
				console.log('Sending POST request...');
				const res = await fetch(location, { method: 'POST', body: form });
				console.log('Response received:', res.status, res.statusText);
				const body = await res.text();
				console.log('Body received:', body.substring(0, 100));
				if (res.status == 201) {
					showResp(respBox, res.ok, `Status: ${res.status} ${res.statusText}\n${body}\n\r\n\r Refresh page for new listing in DELETE section.`);
				}
				else {
					showResp(respBox, res.ok, `Status: ${res.status} ${res.statusText}\n${body}`);
				}
			} catch (e) {
				console.error('Fetch error:', e);
				showResp(respBox, false, `Error: ${e.message}`);
			}
		});


		// PUT (upload file)
		document.getElementById('btn-put').addEventListener('click', async () => {
			const fileInput = document.getElementById('file-put');
			const location  = document.getElementById('put-url').value.trim();
			const respBox = document.getElementById('put-resp');
					if (!fileInput.files || !fileInput.files.length) {
						return showResp(respBox, false, 'Pick a file to upload.');
			}
			const form = new FormData();
			form.append('file', fileInput.files[0]);
			try {
				const res = await fetch(location, { method: 'PUT', body: form });
				const body = await res.text();
				showResp(respBox, res.ok, `Status: ${res.status} ${res.statusText}\n\n${body}`);
			} catch (e) {
						showResp(respBox, false, `Error: ${e.message}`);
			}
		});

		// PUT (simple text as multipart)
		document.getElementById('btn-put-text').addEventListener('click', async () => {
			const respBox = document.getElementById('put-resp');
			const form = new FormData();
			form.append('note', new Blob([`Demo upload ${new Date().toISOString()}`], { type: 'text/plain' }), 'note.txt');
			try {
				console.log('Sending PUT request...');
				const res = await fetch('/internal', { method: 'PUT', body: form });
				console.log('Response received:', res.status, res.statusText);
				const body = await res.text();
				console.log('Body received:', body.substring(0, 100));
				if (res.status == 201) {
					showResp(respBox, res.ok, `Status: ${res.status} ${res.statusText}\n${body}\n\r\n\r Refresh page for new listing in DELETE section.`);
				}
				else {
					showResp(respBox, res.ok, `Status: ${res.status} ${res.statusText}\n${body}`);
				}
			} catch (e) {
				console.error('Fetch error:', e);
				showResp(respBox, false, `Error: ${e.message}`);
			}
		});

		// DELETE
		document.getElementById('btn-del').addEventListener('click', async () => {
			const baseUrl = (document.getElementById('del-url').value || '').trim();
			const fileName = (document.getElementById('del-file').value || '').trim();
			const url = (baseUrl + fileName).trim();
			const respBox = document.getElementById('del-resp');
			if (!confirm(`Delete file: ${url}?`)) return;
			try {
				const res = await fetch(url, { method: 'DELETE' });
				const body = await res.text();
				showResp(respBox, res.ok, `Status: ${res.status} ${res.statusText}\n\n${body} \n\r\n\r Refresh for new listing`);
			} catch (e) {
						showResp(respBox, false, `Error: ${e.message}`);
			}
		});

				loadDeleteListing();
	</script>
</body>
</html>
