server
    listen 8080
    host localhost
    server_name webserv
    client_max_body_size 100000000
    root www-42
    error_page 404 /error/404.html
    error_page 500 /error/500.html
    methods GET
    index index.html
    directory_listing off
    cgi .py /usr/bin/python3
    cgi .bla cgi_tester
    scripts_path YoupiBanane/

   
    location /put_test/
        methods PUT
        upload uploads
 
        methods POST
        

 
    location /post_body
        methods POST
        client_max_body_size 100000000
 
    location /directory 
        methods GET POST
        root YoupiBanane
        index youpi.bad_extension
        directory_listing on